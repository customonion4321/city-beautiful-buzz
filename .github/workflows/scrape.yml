name: City Beautiful Buzz — Hyperlocal News Scraper

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI anytime

permissions:
  contents: write   # needed to commit updated news.json back to the repo

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout repository ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'Backend/requirements.txt'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r Backend/requirements.txt

      # ── 4. Run scraper ────────────────────────────────────────────────────
      - name: Run scraper
        run: python3 Backend/scraper.py
        env:
          PYTHONUNBUFFERED: "1"

      # ── 5. Sync bundled news.json for native Xcode builds ─────────────────
      - name: Sync bundled news.json
        run: |
          cp Backend/data/news.json CityBeautifulBuzz/news.json
          cp Backend/data/news.json CityBeautifulBuzzWidget/news.json

      # ── 6. Commit & push updated news.json ────────────────────────────────
      - name: Commit and push news.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "GitHub Actions Bot"
          git add Backend/data/news.json CityBeautifulBuzz/news.json CityBeautifulBuzzWidget/news.json
          if git diff --staged --quiet; then
            echo "No changes to news.json — skipping commit."
          else
            git commit -m "chore: update hyperlocal news.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
